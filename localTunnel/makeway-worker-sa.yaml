# makeway-worker-sa.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: makeway-worker
  namespace: crossplane-system   # or a dedicated "makeway" namespace
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: makeway-worker
rules:
  - apiGroups: ["makeway.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: makeway-worker
subjects:
  - kind: ServiceAccount
    name: makeway-worker
    namespace: crossplane-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: makeway-worker