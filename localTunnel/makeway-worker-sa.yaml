# makeway-worker-sa.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: makeway-worker
  namespace: crossplane-system   # or a dedicated "makeway" namespace
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: makeway-worker
rules:
  - apiGroups: ["makeway.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  # ArgoCD Applications — health reporter mirrors the live inventory (read-only:
  # ArgoCD itself owns these objects, the worker never writes them).
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    # create: Step-2 applies XR instances (and their credential Secrets) into
    # {app}-{env} namespaces immediately after Step-1 — before ArgoCD has
    # synced the gitops namespace. Idempotent ensure at apply time; deletion
    # stays ArgoCD's (env teardown cascades).
    verbs: ["get", "list", "create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: makeway-worker
subjects:
  - kind: ServiceAccount
    name: makeway-worker
    namespace: crossplane-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: makeway-worker