# EXAMPLE — real credentials are bootstrap-only and NOT committed (same pattern
# as crossplane/secrets/). Copy to aws-credentials.yaml, fill in keys for an
# IAM user with SecretsManager read on makeway/* (the same identity story as the
# Crossplane provider creds), then `kubectl apply -n external-secrets -f`.
#
# Because the ClusterSecretStore references namespaced secret `aws-credentials`,
# the kustomization deliberately lists only the store (selfHeal-safe). The
# Secret is applied once by hand so ArgoCD's prune never deletes and re-renders
# it.
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: external-secrets
  annotations:
    managed-by: makeway-bootstrap  # NOT managed by ArgoCD — do not list in kustomization
type: Opaque
stringData:
  access-key-id: "AKIA..."
  secret-access-key: "REPLACE_ME"