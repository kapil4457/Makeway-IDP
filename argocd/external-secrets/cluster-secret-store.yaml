# The ESO backend contract everything else references: `secretStoreRef:
# {name: makeway, kind: ClusterSecretStore}` in every ExternalSecret the Step-2
# extract phase commits. One store, cluster-scoped, reaching the same AWS
# account the Crossplane ProviderConfig and the Step-2 Lambda target.
#
# Local-cluster mode: static IAM keys (like the Crossplane ProviderConfig —
# see the crossplane/secrets/ bootstrap). To migrate to managed EKS, swap only
# this store's auth to an IRSA-annotated service account (spec.provider.aws.auth
# -> jwt) and delete the static-credential Secret — every app-facing
# ExternalSecret and envFrom wiring stays untouched.
# v1 (not v1beta1): ESO 0.19.x dropped v1beta1 from its CRDs — a v1beta1
# manifest makes ArgoCD's sync fail discovery ("failed to discover server
# resources for group version external-secrets.io/v1beta1").
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: makeway
  labels:
    managed-by: makeway
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            key: access-key-id
            namespace: external-secrets
          secretAccessKeySecretRef:
            name: aws-credentials
            key: secret-access-key
            namespace: external-secrets