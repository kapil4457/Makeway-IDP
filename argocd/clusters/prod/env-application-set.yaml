# Per-environment app catalog for the PROD cluster. Same shape as
# argocd/clusters/qa/env-application-set.yaml — scoped to the prod env folder,
# applied on the cluster it serves. See the qa file for the full rationale.
#
#   kubectl apply -k argocd/clusters/prod
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: makeway-apps-prod
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/kapil4457/Makeway-IDP
        revision: main
        directories:
          - path: argocd/apps/*/envs/prod
  template:
    metadata:
      name: '{{ index .path.segments 2 }}-prod'
      namespace: argocd
      labels:
        app: '{{ index .path.segments 2 }}'
        environment: prod
        managed-by: makeway
    spec:
      project: default
      source:
        repoURL: https://github.com/kapil4457/Makeway-IDP
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ index .path.segments 2 }}-prod'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m