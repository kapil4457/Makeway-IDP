# Mirrors argocd/external-secrets/eso-install-application.yaml — installs the
# External Secrets Operator from its Helm chart, managed by ArgoCD. Canonical
# source: argocd/external-secrets/eso-install-application.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  labels:
    managed-by: makeway
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    targetRevision: ">=0.10.0 <0.20.0"
    chart: external-secrets
    helm:
      parameters:
        # The store's static creds Secret must sit in the operator namespace so
        # the ClusterSecretStore can reference it by name.
        - name: serviceAccount.create
          value: "true"
        - name: serviceAccount.name
          value: external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The ESO 0.19.x CRDs exceed the 256KB etcd annotation limit when applied
      # client-side (the whole manifest is stored in last-applied-configuration)
      # — both CRDs are rejected ("metadata.annotations: Too long") and ESO
      # never installs. Server-side apply bypasses that annotation entirely.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m