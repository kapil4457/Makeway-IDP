# Per-environment app catalog for the QA cluster.
#
# Replaces the old single global ApplicationSet (argocd/root-application.yaml,
# now deleted). Each cluster runs its OWN ArgoCD, so this ApplicationSet is
# scoped to one env folder under argocd/apps/*/envs/ and generates exactly the
# Applications for {app}-{env} overlays of THIS cluster. Because it is applied
# on (and resolves) the cluster it lives on, `server: kubernetes.default.svc`
# stays correct — no `argocd cluster add` is needed.
#
# The generated Application names ({{app}}-<env>) are unchanged from the old
# global set, so existing DeploymentSetup.argocdAppName records stay valid.
#
# goTemplate: true selects Go's text/template engine, so params use the leading
# dot (`{{ .path.path }}`) and indexed segments are `{{ index .path.segments 2 }}`
# (segments of argocd/apps/<app>/envs/qa: 0=argocd 1=apps 2=<app> 3=envs 4=qa).
# The legacy fasttemplate forms — `{{ path }}`, `{{ path[2] }}` — fail Go's
# parser ("bad character U+005B '['") and generate 0 applications.
#
#   kubectl apply -k argocd/clusters/qa
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: makeway-apps-qa
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/kapil4457/Makeway-IDP
        revision: main
        directories:
          - path: argocd/apps/*/envs/qa
  template:
    metadata:
      name: '{{ index .path.segments 2 }}-qa'
      namespace: argocd
      labels:
        app: '{{ index .path.segments 2 }}'
        environment: qa
        managed-by: makeway
    spec:
      project: default
      source:
        repoURL: https://github.com/kapil4457/Makeway-IDP
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ index .path.segments 2 }}-qa'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m