# ExternalSecret template — committed to gitops by the Step-2 extract phase.
#
# ArgoCD applies this into the {appName}-{env} namespace (env overlay). External
# Secrets Operator (installed cluster-side, see argocd/external-secrets/) watches
# it, pulls the matching AWS Secrets Manager secret, and materializes a K8s Secret
# named {target} that the app's Deployment can reference (envFrom / valueFrom).
#
# The ClusterSecretStore `makeway` is created once at bootstrap (cluster-scoped);
# migrating to EKS only swaps the store's backend auth to IRSA — this manifest
# and the app's envFrom wiring are unchanged.
# v1 (not v1beta1): ESO 0.19.x dropped v1beta1 from its CRDs — a v1beta1
# ExternalSecret makes ArgoCD's sync fail discovery on the app overlay too.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: storage
  namespace: zomato-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: makeway
    kind: ClusterSecretStore
  target:
    name: storage
  dataFrom:
    - extract:
        key: makeway/zomato/prod/storage
