# Image patch for python-service in the prod environment.
# The service's CI workflow rewrites the image line below when the branch that
# promotes prod merges (feature/* -> qa, release/* -> uat, main -> prod);
# ArgoCD rolls out the change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-service
spec:
  template:
    spec:
      containers:
        - name: python-service
          image: makeway-placeholder/python-service:pending-first-build