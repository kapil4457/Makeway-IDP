# Image patch for rag-service in the prod environment.
# The service's CI workflow rewrites the image line below when the branch that
# promotes prod merges (feature/* -> qa, release/* -> uat, main -> prod);
# ArgoCD rolls out the change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
spec:
  template:
    spec:
      containers:
        - name: rag-service
          image: kapil4457/makeway-apps:rag-service-2325c9b0ad93edc980dcbf4e55d057800b5b81e8