# Golden-path Deployment for the payment-service service.
# Shared across environments — the envs/<env>/ overrides patch the image tag per
# environment. Makeway CI rewrites those patches after every build on main.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app: payment-service
    managed-by: makeway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: makeway-placeholder/payment-service:pending-first-build
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi