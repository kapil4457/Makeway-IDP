# Image patch for agentic-ai in the prod environment.
# The service's CI workflow rewrites the image line below when the branch that
# promotes prod merges (feature/* -> qa, release/* -> uat, main -> prod);
# ArgoCD rolls out the change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-ai
spec:
  template:
    spec:
      containers:
        - name: agentic-ai
          image: kapil4457/makeway-apps:agentic-ai-67596e8eb23a9218334e66eadc6e1a6693544268