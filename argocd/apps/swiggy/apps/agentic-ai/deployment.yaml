# Golden-path Deployment for the agentic-ai service.
# Shared across environments — the envs/<env>/ overrides patch the image tag per
# environment. Makeway CI rewrites those patches after every build on main.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-ai
  labels:
    app: agentic-ai
    managed-by: makeway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentic-ai
  template:
    metadata:
      labels:
        app: agentic-ai
    spec:
      containers:
        - name: agentic-ai
          image: makeway-placeholder/agentic-ai:pending-first-build
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi