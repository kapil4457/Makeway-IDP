# Image patch for spring-boot in the prod environment.
# The service's CI workflow rewrites the image line below when the branch that
# promotes prod merges (feature/* -> qa, release/* -> uat, main -> prod);
# ArgoCD rolls out the change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot
spec:
  template:
    spec:
      containers:
        - name: spring-boot
          image: kapil4457/makeway-apps:spring-boot-223444e506f1cfaaef8658689fb5830f9e479af3