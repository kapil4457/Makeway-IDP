# Golden-path Deployment for the fast-api service.
# Shared across environments — the envs/<env>/ overrides patch the image tag per
# environment. Makeway CI rewrites those patches after every build on main.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fast-api
  labels:
    app: fast-api
    managed-by: makeway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fast-api
  template:
    metadata:
      labels:
        app: fast-api
    spec:
      containers:
        - name: fast-api
          image: makeway-placeholder/fast-api:pending-first-build
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi