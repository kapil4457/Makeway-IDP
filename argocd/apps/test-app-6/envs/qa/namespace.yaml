# The test-app-6-qa Namespace — created by this overlay and no other.
# Each env overlay owns exactly one Namespace ({app}-{env}), so the qa
# Application never creates or manages uat/prod (and vice versa).
apiVersion: v1
kind: Namespace
metadata:
  name: test-app-6-qa
  labels:
    app: test-app-6
    environment: qa
    managed-by: makeway