# Image patch for fast-api-2 in the prod environment.
# The service's CI workflow rewrites the image line below when the branch that
# promotes prod merges (feature/* -> qa, release/* -> uat, main -> prod);
# ArgoCD rolls out the change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fast-api-2
spec:
  template:
    spec:
      containers:
        - name: fast-api-2
          image: kapil4457/makeway-apps:fast-api-2-cd87f1c8ab5ccf0f18191a8758da706b2176f3d1