# The app-1-qa Namespace — created by this overlay and no other.
# Each env overlay owns exactly one Namespace ({app}-{env}), so the qa
# Application never creates or manages uat/prod (and vice versa).
apiVersion: v1
kind: Namespace
metadata:
  name: app-1-qa
  labels:
    app: app-1
    environment: qa
    managed-by: makeway