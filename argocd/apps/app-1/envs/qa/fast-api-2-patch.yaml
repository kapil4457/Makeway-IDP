# Image patch for fast-api-2 in the qa environment.
# The service's CI workflow rewrites the image line below when the branch that
# promotes qa merges (feature/* -> qa, release/* -> uat, main -> prod);
# ArgoCD rolls out the change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fast-api-2
spec:
  template:
    spec:
      containers:
        - name: fast-api-2
          image: makeway-placeholder/fast-api-2:pending-first-build