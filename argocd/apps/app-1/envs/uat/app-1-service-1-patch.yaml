# Image patch for app-1-service-1 in the uat environment.
# The service's CI workflow rewrites the image line below when the branch that
# promotes uat merges (feature/* -> qa, release/* -> uat, main -> prod);
# ArgoCD rolls out the change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-1-service-1
spec:
  template:
    spec:
      containers:
        - name: app-1-service-1
          image: makeway-placeholder/app-1-service-1:pending-first-build