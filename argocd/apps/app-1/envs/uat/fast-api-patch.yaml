# Image patch for fast-api in the uat environment.
# The service's CI workflow rewrites the image line below when the branch that
# promotes uat merges (feature/* -> qa, release/* -> uat, main -> prod);
# ArgoCD rolls out the change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fast-api
spec:
  template:
    spec:
      containers:
        - name: fast-api
          image: makeway-placeholder/fast-api:pending-first-build