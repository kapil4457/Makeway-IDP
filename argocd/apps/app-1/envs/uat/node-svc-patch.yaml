# Image patch for node-svc in the uat environment.
# The service's CI workflow rewrites the image line below when the branch that
# promotes uat merges (feature/* -> qa, release/* -> uat, main -> prod);
# ArgoCD rolls out the change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-svc
spec:
  template:
    spec:
      containers:
        - name: node-svc
          image: makeway-placeholder/node-svc:pending-first-build