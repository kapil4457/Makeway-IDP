# Golden-path Deployment for the app-1-service-1 service.
# Shared across environments — the envs/<env>/ overrides patch the image tag per
# environment. Makeway CI rewrites those patches after every build on main.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-1-service-1
  labels:
    app: app-1-service-1
    managed-by: makeway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-1-service-1
  template:
    metadata:
      labels:
        app: app-1-service-1
    spec:
      containers:
        - name: app-1-service-1
          image: makeway-placeholder/app-1-service-1:pending-first-build
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi