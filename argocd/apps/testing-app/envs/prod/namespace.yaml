# The testing-app-prod Namespace — created by this overlay and no other.
# Each env overlay owns exactly one Namespace ({app}-{env}), so the qa
# Application never creates or manages uat/prod (and vice versa).
apiVersion: v1
kind: Namespace
metadata:
  name: testing-app-prod
  labels:
    app: testing-app
    environment: prod
    managed-by: makeway