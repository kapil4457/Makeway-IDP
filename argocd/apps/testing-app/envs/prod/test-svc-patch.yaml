# Image patch for test-svc in the prod environment.
# The service's CI workflow rewrites the image line below when the branch that
# promotes prod merges (feature/* -> qa, release/* -> uat, main -> prod);
# ArgoCD rolls out the change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-svc
spec:
  template:
    spec:
      containers:
        - name: test-svc
          image: kapil4457/makeway-apps:test-svc-e9c9de8118095037da33eb9ef8eed69d4accb4ff