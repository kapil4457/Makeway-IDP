apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: makeway-crossplane
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kapil4457/Makeway-IDP
    # The Crossplane configuration root (XRD + Compositions + Providers +
    # Function). Database placement (VPC/subnets) is no longer patched here:
    # the Step-2 Lambda reads it from SSM at provision time and puts it on
    # each claim, so this tree carries no environment-specific values.
    path: crossplane
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true