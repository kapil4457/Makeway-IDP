# Kustomize root for the Crossplane configuration ArgoCD syncs.
#
# Deliberately NOT included:
#   - crossplane/secrets/            — the provider-creds Secret holds live AWS
#     keys patched in during bootstrap. ArgoCD re-rendering it would clobber
#     the real credentials on every sync. Bootstrap-only, gitignored content.
#   - providers/provider-config.yaml — reference doc only. The operational
#     ProviderConfig `makeway` lives in secrets/provider-creds.yaml.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - providers/aws.yaml
  - compositions/storage/definition.yaml
  - compositions/storage/composition.yaml
  - compositions/database/definition.yaml
  - compositions/database/composition.yaml
  - compositions/queue/definition.yaml
  - compositions/queue/composition.yaml
  - compositions/notification/definition.yaml
  - compositions/notification/composition.yaml