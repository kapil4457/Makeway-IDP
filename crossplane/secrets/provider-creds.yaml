# Makeway Crossplane AWS ProviderConfig — local-cluster credentials.
#
# The cluster runs on the developer's machine (k3d/kind/local), so IRSA can't
# supply credentials. We follow the same pattern the platform already uses for
# service-account keys (docs/design/AWS-Service-Accounts.md): a dedicated IAM
# user with a scoped inline policy, keys stored gitignored, never
# `Principal: "*"`.
#
# Bootstrap:
#   1. aws iam create-user --user-name makeway-crossplane
#   2. aws iam put-user-policy  (scoped policy granting RDS/S3/SQS/SNS build +
#      SecretsManager-as-owner; see docs/design/AWS-Service-Accounts.md)
#   3. aws iam create-access-key -> write into the patch below (gitignored)
#   4. kubectl apply -f crossplane/providers/aws.yaml
#      kubectl apply -f crossplane/secrets/provider-creds.yaml
#      kubectl apply -f crossplane/providers/provider-config.yaml
#
# When the cluster moves to managed EKS, this gives way to IRSA — swap the
# static key secret for the OIDC-bound IRSA role and drop the key secret.
apiVersion: v1
kind: Namespace
metadata:
  name: crossplane-system
  labels:
    managed-by: makeway
---
apiVersion: v1
kind: Secret
metadata:
  name: provider-creds
  namespace: crossplane-system
  annotations:
    makeway.io/managed: "true"
# PATCH: real keys live in your local .env, never committed here.
# kubectl create secret generic provider-creds \
#   --namespace crossplane-system \
#   --from-literal=creds='{"accessKeyId":"__PATTERN__","secretAccessKey":"__PATTERN__","sessionToken":""}' \
#   --dry-run=client -o yaml
stringData:
  creds: '{"accessKeyId":"__PATTERN__","secretAccessKey":"__PATTERN__","sessionToken":""}'
---
apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: makeway
  annotations:
    managed-by: makeway
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: provider-creds
      key: creds