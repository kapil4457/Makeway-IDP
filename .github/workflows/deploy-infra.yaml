name: deploy-infra

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: makeway-infra-plan
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Require required TF_VAR inputs
        env:
          MAKEWAY_CONTROL_PLANE_URL: ${{ vars.MAKEWAY_CONTROL_PLANE_URL }}
          MAKEWAY_KUBE_API_ENDPOINT: ${{ vars.MAKEWAY_KUBE_API_ENDPOINT }}
          MAKEWAY_KUBE_TOKEN: ${{ secrets.MAKEWAY_KUBE_TOKEN }}
        run: |
          test -n "$MAKEWAY_CONTROL_PLANE_URL" \
            || { echo "::error::Set MAKEWAY_CONTROL_PLANE_URL in repo Actions variables"; exit 1; }
          test -n "$MAKEWAY_KUBE_API_ENDPOINT" \
            || { echo "::error::Set MAKEWAY_KUBE_API_ENDPOINT in repo Actions variables"; exit 1; }
          test -n "$MAKEWAY_KUBE_TOKEN" \
            || { echo "::error::Set MAKEWAY_KUBE_TOKEN in repo Actions secrets"; exit 1; }

      - name: Terraform Plan
        env:
          TF_VAR_control_plane_url: ${{ vars.MAKEWAY_CONTROL_PLANE_URL }}
          TF_VAR_kube_api_endpoint: ${{ vars.MAKEWAY_KUBE_API_ENDPOINT }}
          TF_VAR_kube_token: ${{ secrets.MAKEWAY_KUBE_TOKEN }}
          # Optional — empty disables TLS verification against the exposed cluster.
          TF_VAR_kube_ca_cert: ${{ vars.MAKEWAY_KUBE_CA_CERT || '' }}
        run: terraform plan -input=false -out=tfplan -no-color

      - name: Show Plan
        run: terraform show -no-color tfplan

   
      - name: Upload consumer function package
        uses: actions/upload-artifact@v4
        with:
          name: consumer-zip
          path: terraform/modules/sqs_consumer/dist/makeway-app-creation-consumer.zip
          if-no-files-found: error

      - name: Upload step-1 function package
        uses: actions/upload-artifact@v4
        with:
          name: step1-zip
          path: terraform/modules/app_creation_step_functions/dist/makeway-app-creation-step1.zip
          if-no-files-found: error

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          if-no-files-found: error

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment:
      name: makeway-infra-deploy
    concurrency:
      group: terraform-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: makeway-infra-apply
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: plan/

      - name: Check plan artifact exists
        working-directory: plan
        run: test -f tfplan

     
      - name: Download consumer function package
        uses: actions/download-artifact@v4
        with:
          name: consumer-zip
          path: terraform/modules/sqs_consumer/dist/

      - name: Download step-1 function package
        uses: actions/download-artifact@v4
        with:
          name: step1-zip
          path: terraform/modules/app_creation_step_functions/dist/

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform Apply
        env:
          TF_VAR_control_plane_url: ${{ vars.MAKEWAY_CONTROL_PLANE_URL }}
          TF_VAR_kube_api_endpoint: ${{ vars.MAKEWAY_KUBE_API_ENDPOINT }}
          TF_VAR_kube_token: ${{ secrets.MAKEWAY_KUBE_TOKEN }}
          TF_VAR_kube_ca_cert: ${{ vars.MAKEWAY_KUBE_CA_CERT || '' }}
        working-directory: terraform
        run: terraform apply -input=false -auto-approve ../plan/tfplan