name: deploy-infra

on:
  workflow_dispatch:
    inputs:
      control_plane_tag:
        description: >-
          Docker Hub tag of the control-plane image to deploy — the build
          workflow tags each main commit with its sha. Leave empty to keep
          the currently deployed image untouched; a first-ever deploy falls
          back to ":latest".
        required: false
        default: ""
      frontend_tag:
        description: >-
          Docker Hub tag of the platform-UI image to deploy — the build
          workflow tags each main commit with its sha. Leave empty to keep
          the currently deployed image untouched; a first-ever deploy falls
          back to ":latest".
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      # Step-1 encrypts GitHub repo secrets with libsodium sealed box, so the
      # PyNaCl package must ship inside the Lambda zip. The wheel is
      # self-contained (bundled libsodium) — no Lambda layer needed.
      # The --target MUST be absolute: this job's run steps default to
      # working-directory terraform/, so a relative target makes pip CREATE
      # terraform/workers/... while archive_file zips <workspace>/workers/...
      # — the zip silently ships without PyNaCl. The asserts below turn that
      # trap into a hard failure.
      - name: Vendor PyNaCl into the Step-1 package
        run: |
          python3 -m pip install --no-compile --disable-pip-version-check \
            --target "${{ github.workspace }}/workers/step_functions/step_1 - GitHub Setup" pynacl

      - name: Assert PyNaCl is vendored into the Step-1 source dir
        run: |
          test -f "${{ github.workspace }}/workers/step_functions/step_1 - GitHub Setup/nacl/__init__.py" \
            || { echo "::error::PyNaCl missing from the Step-1 source dir — vendor step targeted the wrong path"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: makeway-infra-plan
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

      # Image resolution for the whole platform, in one workflow: an explicit
      # tag input deploys that image; an empty input pins the live task-def
      # image so the plan rolls nothing the run doesn't ship (the terraform
      # config otherwise defaults ecs_image / frontend_image to floating
      # ":latest" tags). A family absent (first-ever deploy) falls back to
      # ":latest" — the tag the build workflows push on every main commit.
      - name: Resolve the control-plane image
        id: pin_cp
        env:
          CP_TAG: ${{ inputs.control_plane_tag }}
        run: |
          set -euo pipefail
          REPO="${{ vars.DOCKERHUB_CONTROL_PLANE_IMAGE || 'kapil4457/makeway-control-plane' }}"
          if [ -n "$CP_TAG" ]; then
            CP_CURRENT="$REPO:$CP_TAG"
          else
            CLUSTER="$(terraform output -raw ecs_cluster_name 2>/dev/null || echo makeway)"
            CP_CURRENT="$(aws ecs describe-task-definition --task-definition "$CLUSTER" \
              --query 'taskDefinition.containerDefinitions[?name==`app`].image' --output text 2>/dev/null || true)"
            if [ -z "$CP_CURRENT" ] || [ "$CP_CURRENT" = "None" ]; then
              CP_CURRENT="$REPO:latest"
            fi
          fi
          echo "cp_image=$CP_CURRENT" >> "$GITHUB_OUTPUT"

      - name: Resolve the platform-UI image
        id: pin_ui
        env:
          UI_TAG: ${{ inputs.frontend_tag }}
        run: |
          set -euo pipefail
          REPO="${{ vars.DOCKERHUB_FRONTEND_IMAGE || 'kapil4457/makeway-frontend' }}"
          if [ -n "$UI_TAG" ]; then
            UI_CURRENT="$REPO:$UI_TAG"
          else
            CLUSTER="$(terraform output -raw ecs_cluster_name 2>/dev/null || echo makeway)"
            UI_CURRENT="$(aws ecs describe-task-definition --task-definition "$CLUSTER-ui" \
              --query 'taskDefinition.containerDefinitions[?name==`ui`].image' --output text 2>/dev/null || true)"
            if [ -z "$UI_CURRENT" ] || [ "$UI_CURRENT" = "None" ]; then
              UI_CURRENT="$REPO:latest"
            fi
          fi
          echo "ui_image=$UI_CURRENT" >> "$GITHUB_OUTPUT"

      - name: Require required TF_VAR inputs
        env:
          MAKEWAY_KUBE_API_ENDPOINT: ${{ vars.MAKEWAY_KUBE_API_ENDPOINT }}
          MAKEWAY_KUBE_TOKEN: ${{ secrets.MAKEWAY_KUBE_TOKEN }}
        run: |
          test -n "$MAKEWAY_KUBE_API_ENDPOINT" \
            || { echo "::error::Set MAKEWAY_KUBE_API_ENDPOINT in repo Actions variables"; exit 1; }
          test -n "$MAKEWAY_KUBE_TOKEN" \
            || { echo "::error::Set MAKEWAY_KUBE_TOKEN in repo Actions secrets"; exit 1; }

      - name: Terraform Plan
        env:
          TF_VAR_kube_api_endpoint: ${{ vars.MAKEWAY_KUBE_API_ENDPOINT }}
          TF_VAR_kube_token: ${{ secrets.MAKEWAY_KUBE_TOKEN }}
          # Optional — empty disables TLS verification against the exposed cluster.
          TF_VAR_kube_ca_cert: ${{ vars.MAKEWAY_KUBE_CA_CERT || '' }}
          # Optional — the bastion SSH *public* key CONTENT (not a secret; safe
          # as a plain variable; variable name deliberately has no "path": a
          # file() path can't resolve a runtime-staged file in the apply job).
          # Empty skips aws_key_pair.bastion, which strands the bastion reverse
          # tunnel (localTunnel/bastion-tunnel.md) on fresh deploys.
          TF_VAR_bastion_ssh_public_key: ${{ vars.MAKEWAY_BASTION_SSH_PUBLIC_KEY || '' }}
          TF_VAR_ecs_image: ${{ steps.pin_cp.outputs.cp_image }}
          TF_VAR_frontend_image: ${{ steps.pin_ui.outputs.ui_image }}
        run: terraform plan -input=false -out=tfplan -no-color

      # Ground truth: the zip archive_file just rebuilt must actually contain
      # PyNaCl, or the deployed worker silently skips Actions-config injection.
      - name: Assert the Step-1 zip carries PyNaCl
        run: |
          python3 - <<'EOF'
          import os, zipfile
          zpath = os.path.join(os.environ["GITHUB_WORKSPACE"],
                               "terraform/modules/app_creation_step_functions/dist/makeway-app-creation-step1.zip")
          names = zipfile.ZipFile(zpath).namelist()
          nacl = [n for n in names if n.startswith("nacl/")]
          assert nacl, "Step-1 zip lacks PyNaCl — Actions-config injection would skip with 'No module named nacl'"
          print("Step-1 zip OK: %d nacl entries" % len(nacl))
          EOF

      - name: Show Plan
        run: terraform show -no-color tfplan

   
      - name: Upload consumer function package
        uses: actions/upload-artifact@v4
        with:
          name: consumer-zip
          path: terraform/modules/sqs_consumer/dist/makeway-app-creation-consumer.zip
          if-no-files-found: error

      - name: Upload step-1 function package
        uses: actions/upload-artifact@v4
        with:
          name: step1-zip
          path: terraform/modules/app_creation_step_functions/dist/makeway-app-creation-step1.zip
          if-no-files-found: error

      - name: Upload step-2 function package
        uses: actions/upload-artifact@v4
        with:
          name: step2-zip
          path: terraform/modules/app_creation_step_functions/dist/makeway-app-creation-step2.zip
          if-no-files-found: error

      - name: Upload health-reporter function package
        uses: actions/upload-artifact@v4
        with:
          name: health-reporter-zip
          path: terraform/modules/health_reporter/dist/makeway-argocd-health-reporter.zip
          if-no-files-found: error

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          if-no-files-found: error

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment:
      name: makeway-infra-deploy
    concurrency:
      group: terraform-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      # Same rationale as the plan job's vendor step: the apply job normally
      # consumes the plan-built zips as artifacts, but if apply is ever run
      # plan-less (terraform apply without a plan file) archive_file re-zips
      # THIS checkout — which must then carry PyNaCl too. Idempotent either
      # way. Absolute --target so the path never depends on the step's cwd.
      - name: Vendor PyNaCl into the Step-1 package
        run: |
          python3 -m pip install --no-compile --disable-pip-version-check \
            --target "${{ github.workspace }}/workers/step_functions/step_1 - GitHub Setup" pynacl

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: makeway-infra-apply
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: plan/

      - name: Check plan artifact exists
        working-directory: plan
        run: test -f tfplan

     
      - name: Download consumer function package
        uses: actions/download-artifact@v4
        with:
          name: consumer-zip
          path: terraform/modules/sqs_consumer/dist/

      - name: Download step-1 function package
        uses: actions/download-artifact@v4
        with:
          name: step1-zip
          path: terraform/modules/app_creation_step_functions/dist/

      - name: Download step-2 function package
        uses: actions/download-artifact@v4
        with:
          name: step2-zip
          path: terraform/modules/app_creation_step_functions/dist/

      - name: Download health-reporter function package
        uses: actions/download-artifact@v4
        with:
          name: health-reporter-zip
          path: terraform/modules/health_reporter/dist/

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false

      # Same resolution as the plan job — needed only for the plan-less edge
      # case (applying the downloaded plan uses the values baked in by the
      # plan job), matching how the vendor step above is kept idempotent.
      - name: Resolve the control-plane image
        id: pin_cp
        working-directory: terraform
        env:
          CP_TAG: ${{ inputs.control_plane_tag }}
        run: |
          set -euo pipefail
          REPO="${{ vars.DOCKERHUB_CONTROL_PLANE_IMAGE || 'kapil4457/makeway-control-plane' }}"
          if [ -n "$CP_TAG" ]; then
            CP_CURRENT="$REPO:$CP_TAG"
          else
            CLUSTER="$(terraform output -raw ecs_cluster_name 2>/dev/null || echo makeway)"
            CP_CURRENT="$(aws ecs describe-task-definition --task-definition "$CLUSTER" \
              --query 'taskDefinition.containerDefinitions[?name==`app`].image' --output text 2>/dev/null || true)"
            if [ -z "$CP_CURRENT" ] || [ "$CP_CURRENT" = "None" ]; then
              CP_CURRENT="$REPO:latest"
            fi
          fi
          echo "cp_image=$CP_CURRENT" >> "$GITHUB_OUTPUT"

      - name: Resolve the platform-UI image
        id: pin_ui
        working-directory: terraform
        env:
          UI_TAG: ${{ inputs.frontend_tag }}
        run: |
          set -euo pipefail
          REPO="${{ vars.DOCKERHUB_FRONTEND_IMAGE || 'kapil4457/makeway-frontend' }}"
          if [ -n "$UI_TAG" ]; then
            UI_CURRENT="$REPO:$UI_TAG"
          else
            CLUSTER="$(terraform output -raw ecs_cluster_name 2>/dev/null || echo makeway)"
            UI_CURRENT="$(aws ecs describe-task-definition --task-definition "$CLUSTER-ui" \
              --query 'taskDefinition.containerDefinitions[?name==`ui`].image' --output text 2>/dev/null || true)"
            if [ -z "$UI_CURRENT" ] || [ "$UI_CURRENT" = "None" ]; then
              UI_CURRENT="$REPO:latest"
            fi
          fi
          echo "ui_image=$UI_CURRENT" >> "$GITHUB_OUTPUT"

      - name: Terraform Apply
        env:
          TF_VAR_kube_api_endpoint: ${{ vars.MAKEWAY_KUBE_API_ENDPOINT }}
          TF_VAR_kube_token: ${{ secrets.MAKEWAY_KUBE_TOKEN }}
          TF_VAR_kube_ca_cert: ${{ vars.MAKEWAY_KUBE_CA_CERT || '' }}
          # Same as plan — keeps the plan-less apply path consistent (the
          # normal path consumes the plan, which has the key baked in).
          TF_VAR_bastion_ssh_public_key: ${{ vars.MAKEWAY_BASTION_SSH_PUBLIC_KEY || '' }}
          TF_VAR_ecs_image: ${{ steps.pin_cp.outputs.cp_image }}
          TF_VAR_frontend_image: ${{ steps.pin_ui.outputs.ui_image }}
        working-directory: terraform
        run: terraform apply -input=false -auto-approve ../plan/tfplan

      # terraform apply only updates the task definitions — ECS rolls tasks
      # on its own, and a green apply says nothing about whether replacement
      # tasks actually started. Wait for steady state so a stuck rollout
      # (pull failure, missing capacity) fails this run loudly instead of
      # serving the old image behind a green check. Both waits: whichever
      # image a tag input shipped, and a no-op when neither changed.
      - name: Wait for the ECS rollouts to go stable
        working-directory: terraform
        run: |
          CLUSTER="$(terraform output -raw ecs_cluster_name)"
          aws ecs wait services-stable --cluster "$CLUSTER" \
            --services "$(terraform output -raw ecs_service_name)"
          aws ecs wait services-stable --cluster "$CLUSTER" \
            --services "$(terraform output -raw ui_service_name)"