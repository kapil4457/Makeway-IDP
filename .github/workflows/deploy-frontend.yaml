name: deploy-frontend

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: >-
          Docker Hub tag of the platform-UI image to deploy
          (e.g. "latest", or a git-sha tag pushed by build-frontend).
        required: false
        default: latest

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: makeway-infra-deploy
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: makeway-frontend-deploy
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"

      - name: Resolve image reference
        id: image
        run: |
          echo "image=${{ vars.DOCKERHUB_FRONTEND_IMAGE || 'kapil4457/makeway-frontend' }}:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Pin the control-plane image (deploy only the UI)
        id: pin
        run: |
          set -euo pipefail
          CLUSTER="$(terraform output -raw ecs_cluster_name 2>/dev/null || echo makeway)"
          CP_CURRENT="$(aws ecs describe-task-definition --task-definition "$CLUSTER" \
            --query 'taskDefinition.containerDefinitions[?name==`app`].image' --output text 2>/dev/null || true)"
          if [ -z "$CP_CURRENT" ] || [ "$CP_CURRENT" = "None" ]; then
            # Family doesn't exist yet (first-ever deploy) — fall back to the
            # image the control-plane workflow deploys by default.
            CP_CURRENT="${{ vars.DOCKERHUB_CONTROL_PLANE_IMAGE || 'kapil4457/makeway-control-plane' }}:latest"
          fi
          echo "cp_image=$CP_CURRENT" >> "$GITHUB_OUTPUT"

      - name: Require required TF_VAR inputs
        env:
          MAKEWAY_KUBE_API_ENDPOINT: ${{ vars.MAKEWAY_KUBE_API_ENDPOINT }}
          MAKEWAY_KUBE_TOKEN: ${{ secrets.MAKEWAY_KUBE_TOKEN }}
        run: |
          test -n "$MAKEWAY_KUBE_API_ENDPOINT" \
            || { echo "::error::Set MAKEWAY_KUBE_API_ENDPOINT in repo Actions variables"; exit 1; }
          test -n "$MAKEWAY_KUBE_TOKEN" \
            || { echo "::error::Set MAKEWAY_KUBE_TOKEN in repo Actions secrets"; exit 1; }

      - name: Terraform Plan
        id: plan
        run: terraform plan -input=false -out=tfplan -no-color
        env:
          TF_VAR_ecs_image: ${{ steps.pin.outputs.cp_image }}
          TF_VAR_frontend_image: ${{ steps.image.outputs.image }}
          TF_VAR_kube_api_endpoint: ${{ vars.MAKEWAY_KUBE_API_ENDPOINT }}
          TF_VAR_kube_token: ${{ secrets.MAKEWAY_KUBE_TOKEN }}
          TF_VAR_kube_ca_cert: ${{ vars.MAKEWAY_KUBE_CA_CERT || '' }}

      - name: Show Plan
        run: terraform show -no-color tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
        env:
          TF_VAR_ecs_image: ${{ steps.pin.outputs.cp_image }}
          TF_VAR_frontend_image: ${{ steps.image.outputs.image }}
          TF_VAR_kube_api_endpoint: ${{ vars.MAKEWAY_KUBE_API_ENDPOINT }}
          TF_VAR_kube_token: ${{ secrets.MAKEWAY_KUBE_TOKEN }}
          TF_VAR_kube_ca_cert: ${{ vars.MAKEWAY_KUBE_CA_CERT || '' }}