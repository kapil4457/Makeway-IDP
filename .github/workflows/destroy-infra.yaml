name: destroy-infra

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: >-
          Type "yes" to destroy ALL platform resources (VPC, ECS, RDS, ALB,
          SQS, NAT, IAM). The GitHub Actions OIDC role/provider live in
          terraform/bootstrap/ (separate state) and are NOT destroyed.
          This is permanent and NOT reversible.
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-deploy
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment:
      name: makeway-infra-deploy
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Confirm destruction
        working-directory: ${{ github.workspace }}
        run: |
          if [[ "${{ inputs.confirm }}" != "yes" ]]; then
            echo "::error::Destroy aborted. Type 'yes' in the confirm input to proceed."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: makeway-infra-destroy
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Require required TF_VAR inputs
        env:
          MAKEWAY_CONTROL_PLANE_URL: ${{ vars.MAKEWAY_CONTROL_PLANE_URL }}
          MAKEWAY_KUBE_API_ENDPOINT: ${{ vars.MAKEWAY_KUBE_API_ENDPOINT }}
          MAKEWAY_KUBE_TOKEN: ${{ secrets.MAKEWAY_KUBE_TOKEN }}
        run: |
          test -n "$MAKEWAY_CONTROL_PLANE_URL" \
            || { echo "::error::Set MAKEWAY_CONTROL_PLANE_URL in repo Actions variables"; exit 1; }
          test -n "$MAKEWAY_KUBE_API_ENDPOINT" \
            || { echo "::error::Set MAKEWAY_KUBE_API_ENDPOINT in repo Actions variables"; exit 1; }
          test -n "$MAKEWAY_KUBE_TOKEN" \
            || { echo "::error::Set MAKEWAY_KUBE_TOKEN in repo Actions secrets"; exit 1; }

      - name: Show resources in state
        run: terraform state list

      - name: Terraform Plan Destroy
        env:
          TF_VAR_control_plane_url: ${{ vars.MAKEWAY_CONTROL_PLANE_URL }}
          TF_VAR_kube_api_endpoint: ${{ vars.MAKEWAY_KUBE_API_ENDPOINT }}
          TF_VAR_kube_token: ${{ secrets.MAKEWAY_KUBE_TOKEN }}
          TF_VAR_kube_ca_cert: ${{ vars.MAKEWAY_KUBE_CA_CERT || '' }}
        run: terraform plan -destroy -input=false -out=tfdestroy -no-color

      - name: Show Destroy Plan
        run: terraform show -no-color tfdestroy

      - name: Drain ECS before destroy
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
        run: |
          set -euo pipefail
          # Outputs may already be gone on a re-run after a partial destroy —
          # drain only what still exists. The ASG lookup below is independent.
          CLUSTER="$(terraform output -raw ecs_cluster_name 2>/dev/null || true)"
          SERVICE="$(terraform output -raw ecs_service_name 2>/dev/null || true)"
          if [ -n "$CLUSTER" ] && [ -n "$SERVICE" ]; then
            # Stop the control-plane task so DeleteService doesn't hang waiting on
            # a RUNNING task (the capacity provider also can't drain while it runs).
            aws ecs update-service --region "$AWS_REGION" --cluster "$CLUSTER" \
              --service "$SERVICE" --desired-count 0
            aws ecs wait services-stable --region "$AWS_REGION" \
              --cluster "$CLUSTER" --services "$SERVICE"
          fi
          # Scale the container-instance ASG to zero. Without this the capacity
          # provider's managed scaling (target_capacity=100) keeps terminating
          # the idle instance while the ASG relaunches one -> stop/start churn
          # that blocks DeleteCapacityProvider until the provider times out.
          ASG="$(aws autoscaling describe-auto-scaling-groups --region "$AWS_REGION" \
            --query "AutoScalingGroups[?Tags[?Key=='AmazonECSManaged']].AutoScalingGroupName" \
            --output text)"
          if [ -n "$ASG" ]; then
            INSTANCES="$(aws autoscaling describe-auto-scaling-groups --region "$AWS_REGION" \
              --auto-scaling-group-name "$ASG" \
              --query "AutoScalingGroups[0].Instances[].InstanceId" --output text)"
            # Release scale-in protection so desired-capacity 0 can actually
            # terminate the instance (protect_from_scale_in = true otherwise blocks it).
            if [ -n "$INSTANCES" ]; then
              aws autoscaling set-instance-protection --region "$AWS_REGION" \
                --auto-scaling-group-name "$ASG" --instance-ids $INSTANCES \
                --no-protected-from-scale-in >/dev/null
            fi
            aws autoscaling update-auto-scaling-group --region "$AWS_REGION" \
              --auto-scaling-group-name "$ASG" --min-size 0 --max-size 0 \
              --desired-capacity 0
          fi

      - name: Terraform Destroy
        env:
          TF_VAR_control_plane_url: ${{ vars.MAKEWAY_CONTROL_PLANE_URL }}
          TF_VAR_kube_api_endpoint: ${{ vars.MAKEWAY_KUBE_API_ENDPOINT }}
          TF_VAR_kube_token: ${{ secrets.MAKEWAY_KUBE_TOKEN }}
          TF_VAR_kube_ca_cert: ${{ vars.MAKEWAY_KUBE_CA_CERT || '' }}
        run: terraform apply -input=false -auto-approve tfdestroy