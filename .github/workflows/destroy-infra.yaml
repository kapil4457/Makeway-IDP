name: destroy-infra

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: >-
          Type "yes" to destroy ALL platform resources (VPC, ECS, RDS, ALB,
          SQS, NAT, IAM). The GitHub Actions OIDC role/provider live in
          terraform/bootstrap/ (separate state) and are NOT destroyed.
          This is permanent and NOT reversible.
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-deploy
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment:
      name: makeway-infra-deploy
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Confirm destruction
        working-directory: ${{ github.workspace }}
        run: |
          if [[ "${{ inputs.confirm }}" != "yes" ]]; then
            echo "::error::Destroy aborted. Type 'yes' in the confirm input to proceed."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: makeway-infra-destroy
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Require required TF_VAR inputs
        env:
          MAKEWAY_KUBE_API_ENDPOINT: ${{ vars.MAKEWAY_KUBE_API_ENDPOINT }}
          MAKEWAY_KUBE_TOKEN: ${{ secrets.MAKEWAY_KUBE_TOKEN }}
        run: |
          test -n "$MAKEWAY_KUBE_API_ENDPOINT" \
            || { echo "::error::Set MAKEWAY_KUBE_API_ENDPOINT in repo Actions variables"; exit 1; }
          test -n "$MAKEWAY_KUBE_TOKEN" \
            || { echo "::error::Set MAKEWAY_KUBE_TOKEN in repo Actions secrets"; exit 1; }

      - name: Show resources in state
        run: terraform state list

      - name: Terraform Plan Destroy
        env:
          TF_VAR_kube_api_endpoint: ${{ vars.MAKEWAY_KUBE_API_ENDPOINT }}
          TF_VAR_kube_token: ${{ secrets.MAKEWAY_KUBE_TOKEN }}
          TF_VAR_kube_ca_cert: ${{ vars.MAKEWAY_KUBE_CA_CERT || '' }}
        run: terraform plan -destroy -input=false -out=tfdestroy -no-color

      - name: Show Destroy Plan
        run: terraform show -no-color tfdestroy

      - name: Drain ECS before destroy
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: |
          set -euo pipefail
          # Outputs may already be gone on a re-run after a partial destroy —
          # drain only what still exists. The ASG lookup below is independent.
          CLUSTER="$(terraform output -raw ecs_cluster_name 2>/dev/null || true)"
          # Drain every platform service that still exists (control plane +
          # platform UI — both run in the same cluster and must be drained
          # before the capacity provider can release its instances). Gated on
          # the LIVE service status: update/delete/wait all error on a service
          # a previous partial run already left DRAINING or deleted, and this
          # step must stay idempotent so a re-run can finish a partial destroy.
          SERVICES=()
          for NAME in \
            "$(terraform output -raw ecs_service_name 2>/dev/null || true)" \
            "$(terraform output -raw ui_service_name 2>/dev/null || true)"
          do
            [ -n "$NAME" ] || continue
            STATUS="$(aws ecs describe-services --region "$AWS_REGION" \
              --cluster "$CLUSTER" --service "$NAME" \
              --query 'services[0].status' --output text 2>/dev/null || true)"
            if [ "$STATUS" = "ACTIVE" ] || [ "$STATUS" = "DRAINING" ]; then
              SERVICES+=("$NAME")
            fi
          done
          if [ -n "$CLUSTER" ] && [ "${#SERVICES[@]}" -gt 0 ]; then
            for SERVICE in "${SERVICES[@]}"; do
              # Stop each service's tasks (--force bypasses a stuck deployment
              # circuit breaker) so the force-delete below completes fast.
              aws ecs update-service --region "$AWS_REGION" --cluster "$CLUSTER" \
                --service "$SERVICE" --desired-count 0 --force >/dev/null || true
            done
            for SERVICE in "${SERVICES[@]}"; do
              # Force-DELETE the services HERE and wait for INACTIVE — leaving
              # the delete to Terraform is what wedged the first destroy: the
              # service sat in DRAINING (a task stuck STOPPING after its
              # container instance was reaped) past the provider's 20m delete
              # timeout. Terraform then finds them gone at refresh and just
              # drops them from state.
              aws ecs delete-service --region "$AWS_REGION" --cluster "$CLUSTER" \
                --service "$SERVICE" --force >/dev/null || true
            done
            for SERVICE in "${SERVICES[@]}"; do
              aws ecs wait services-inactive --region "$AWS_REGION" \
                --cluster "$CLUSTER" --service "$SERVICE" \
                || echo "::warning::$SERVICE did not reach INACTIVE — Terraform's delete wait will handle it."
            done
          fi
          # Scale the container-instance ASG to zero — only AFTER the services
          # are INACTIVE, so managed draining never has a task to hold on the
          # instance (a stopping task keeps instance protection on, which
          # blocks both the termination and the service delete — the stuck
          # state the first destroy died in). Two more reasons for this block:
          # releasing scale-in protection lets desired-capacity 0 actually
          # terminate (protect_from_scale_in = true otherwise blocks it), and
          # without the scale-to-zero the capacity provider's managed scaling
          # (target_capacity=100) keeps terminating the idle instance while
          # the ASG relaunches one -> churn that blocks DeleteCapacityProvider
          # until the provider times out.
          ASG="$(aws autoscaling describe-auto-scaling-groups --region "$AWS_REGION" \
            --query "AutoScalingGroups[?Tags[?Key=='AmazonECSManaged']].AutoScalingGroupName" \
            --output text)"
          if [ -n "$ASG" ]; then
            INSTANCES="$(aws autoscaling describe-auto-scaling-groups --region "$AWS_REGION" \
              --auto-scaling-group-name "$ASG" \
              --query "AutoScalingGroups[0].Instances[].InstanceId" --output text)"
            if [ -n "$INSTANCES" ]; then
              aws autoscaling set-instance-protection --region "$AWS_REGION" \
                --auto-scaling-group-name "$ASG" --instance-ids $INSTANCES \
                --no-protected-from-scale-in >/dev/null
            fi
            aws autoscaling update-auto-scaling-group --region "$AWS_REGION" \
              --auto-scaling-group-name "$ASG" --min-size 0 --max-size 0 \
              --desired-capacity 0
          fi

      - name: Terraform Destroy
        env:
          TF_VAR_kube_api_endpoint: ${{ vars.MAKEWAY_KUBE_API_ENDPOINT }}
          TF_VAR_kube_token: ${{ secrets.MAKEWAY_KUBE_TOKEN }}
          TF_VAR_kube_ca_cert: ${{ vars.MAKEWAY_KUBE_CA_CERT || '' }}
        # terraform destroy (fresh refresh + plan + apply) instead of applying
        # the pre-drain tfdestroy: the drain force-deleted the services, so
        # that plan file is stale — replaying it would call DeleteService on
        # resources that no longer exist. destroy re-plans after the drain, so
        # already-deleted resources are dropped at refresh for free.
        run: terraform destroy -input=false -auto-approve -no-color