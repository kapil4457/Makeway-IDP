# CI for the __SERVICE_NAME__ service — rendered by the Makeway Step-1 worker
# and placed at <services-repo>/.github/workflows/ci-__SERVICE_NAME__.yaml.
#
# Runs on merge to main and only when the service's folder changed. Builds and
# pushes the service image, then bumps the image tag inside the Makeway gitops
# folder (argocd/apps/__APP_NAME__/envs/<env>/__SERVICE_NAME__-patch.yaml) so
# ArgoCD rolls out the new version.
name: ci-__SERVICE_NAME__

on:
  push:
    branches: [main]
    paths:
      - '__SERVICE_NAME__/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: __SERVICE_NAME__/
          push: true
          tags: |
            ${{ vars.DOCKERHUB_IMAGE }}:__SERVICE_NAME__-latest
            ${{ vars.DOCKERHUB_IMAGE }}:__SERVICE_NAME__-${{ github.sha }}

      # GitOps loop: after pushing the image, rewrite the image line in every
      # environment's patch file for this service inside the Makeway platform
      # repo. The makeway-apps ApplicationSet syncs those env overlays, so
      # ArgoCD rolls out the change automatically.
      - name: Update image tag in Makeway gitops
        if: ${{ vars.DOCKERHUB_IMAGE != '' && secrets.GITOPS_PAT != '' }}
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
          GITOPS_REPO: __GITOPS_REPO__
          APP_NAME: __APP_NAME__
          SERVICE_NAME: __SERVICE_NAME__
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          git clone --depth 1 "https://x-access-token:${GITOPS_PAT}@github.com/${GITOPS_REPO}.git" "${TMP_DIR}/platform"
          cd "${TMP_DIR}/platform"
          git config user.name "makeway-cicd"
          git config user.email "makeway-cicd@users.noreply.github.com"

          IMAGE="${DOCKERHUB_IMAGE}:${SERVICE_NAME}-${GITHUB_SHA}"
          PATCHES_DIR="argocd/apps/${APP_NAME}/envs"
          UPDATED=0
          for env_dir in "${PATCHES_DIR}"/*/; do
            test -d "${env_dir}" || continue
            patch_file="${env_dir}${SERVICE_NAME}-patch.yaml"
            test -f "${patch_file}" || continue
            sed -i "s|^\( *image: \).*|\1${IMAGE}|" "${patch_file}"
            UPDATED=1
          done

          if [ "${UPDATED}" -eq 0 ]; then
            echo "No env patch found for ${SERVICE_NAME} under ${PATCHES_DIR} — nothing to update."
            exit 0
          fi

          git add -A
          git diff --cached --quiet || {
            git commit -m "ci: bump ${SERVICE_NAME} image to ${GITHUB_SHA} [skip ci]"
            git push
          }