# CI for the __SERVICE_NAME__ service — rendered by the Makeway Step-1 worker
# and placed at <services-repo>/.github/workflows/ci-__SERVICE_NAME__.yaml.
#
# Runs on push to the branch that promotes this service's tier, and only when
# the service's folder changed:
#   - merge to main         -> prod image (argocd/apps/__APP_NAME__/envs/prod/...)
#   - merge to release/*    -> uat image
#   - merge to feature/*    -> qa image
# The image tag is then bumped inside the Makeway gitops folder for THAT
# environment only, so ArgoCD rolls out just the promoted tier.
name: ci-__SERVICE_NAME__

on:
  push:
    branches:
      - main
      - release/**
      - feature/**
    paths:
      - '__SERVICE_NAME__/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # branch -> environment that receives this build.
      #   main       -> prod
      #   release/*  -> uat
      #   feature/*  -> qa
      - name: Resolve target environment
        id: env
        run: |
          case "${GITHUB_REF_NAME}" in
            main)          ENV="prod" ;;
            release/*)     ENV="uat" ;;
            feature/*)     ENV="qa" ;;
            *)             echo "No deployment environment for branch ${GITHUB_REF_NAME}."; exit 1 ;;
          esac
          echo "TARGET_ENV=${ENV}" >> "${GITHUB_OUTPUT}"
          echo "Building ${ENV} image for __SERVICE_NAME__."

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: __SERVICE_NAME__/
          push: true
          tags: |
            ${{ vars.DOCKERHUB_IMAGE }}:__SERVICE_NAME__-latest
            ${{ vars.DOCKERHUB_IMAGE }}:__SERVICE_NAME__-${{ github.sha }}

      # GitOps loop: after pushing, rewrite the image line in this service's
      # patch file for the resolved environment ONLY
      # (argocd/apps/<app>/envs/<env>/<service>-patch.yaml). Other tiers keep
      # their current image; each env is promoted by its own branch.
      - name: Update image tag in Makeway gitops
        if: ${{ vars.DOCKERHUB_IMAGE != '' && secrets.GITOPS_PAT != '' }}
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
          GITOPS_REPO: __GITOPS_REPO__
          APP_NAME: __APP_NAME__
          SERVICE_NAME: __SERVICE_NAME__
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          TARGET_ENV: ${{ steps.env.outputs.TARGET_ENV }}
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          git clone --depth 1 "https://x-access-token:${GITOPS_PAT}@github.com/${GITOPS_REPO}.git" "${TMP_DIR}/platform"
          cd "${TMP_DIR}/platform"
          git config user.name "makeway-cicd"
          git config user.email "makeway-cicd@users.noreply.github.com"

          IMAGE="${DOCKERHUB_IMAGE}:${SERVICE_NAME}-${GITHUB_SHA}"
          PATCH_DIR="argocd/apps/${APP_NAME}/envs/${TARGET_ENV}"
          patch_file="${PATCH_DIR}/${SERVICE_NAME}-patch.yaml"
          if [ ! -f "${patch_file}" ]; then
            echo "No ${TARGET_ENV} patch found for ${SERVICE_NAME} at ${patch_file} — nothing to update."
            exit 0
          fi

          sed -i "s|^\( *image: \).*|\1${IMAGE}|" "${patch_file}"

          git add -A
          git diff --cached --quiet || {
            git commit -m "ci: bump ${SERVICE_NAME} image to ${GITHUB_SHA} (${TARGET_ENV}) [skip ci]"
            git push
          }