# Golden-path Deployment for the __SERVICE_NAME__ service.
# Shared across environments — the envs/<env>/ overrides patch the image tag per
# environment. Makeway CI rewrites those patches after every build on main.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: __SERVICE_NAME__
  labels:
    app: __SERVICE_NAME__
    managed-by: makeway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: __SERVICE_NAME__
  template:
    metadata:
      labels:
        app: __SERVICE_NAME__
    spec:
      containers:
        - name: __SERVICE_NAME__
          image: __IMAGE__
          ports:
            - containerPort: __PORT__
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi