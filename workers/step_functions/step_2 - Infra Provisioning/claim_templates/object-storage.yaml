# XR template — ObjectStorage (makeway.io/v1beta1)
# Rendered by the Step-2 worker and applied into {appName}-{env}. Crossplane
# expands it via the object-storage.aws Composition into one S3 bucket
# (+ optional CloudFront) and the function writes connection details back into
# the {xrName}-connection Secret in the XR's namespace.
#
# bucketName is generated by the worker as {app}-{env}-storage so it is
# globally unique and deterministic across retries.
apiVersion: makeway.io/v1beta1
kind: ObjectStorage
metadata:
  name: __CLAIM_NAME__
  namespace: __NAMESPACE__
  labels:
    managed-by: makeway
    app: __APP_NAME__
    environment: __ENV__
    capability-id: "__CAPABILITY_ID__"
spec:
  # v2 XR control-plane machinery: which Composition expands this instance.
  crossplane:
    compositionRef:
      name: object-storage.aws
  writeConnectionSecretToRef:
    name: __CONN_SECRET__
  parameters:
    bucketName: __BUCKET_NAME__
    region: __REGION__
    cloudfront: __CLOUDFRONT__