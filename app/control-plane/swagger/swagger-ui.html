<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Makeway · API Docs</title>

    <link rel="icon"
          type="image/svg+xml"
          href="/swagger/logo.svg?v=2">

    <!-- Same typeface as the frontend (it self-hosts @fontsource-variable/geist). -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">

    <style>
        /* Makeway design tokens — mirrors the frontend's neutral light theme
           (src/index.css :root) plus the brand purple from the logo mark. */
        :root {
            --makeway-bg: #ffffff;
            --makeway-surface: #ffffff;
            --makeway-header: #fafafa;        /* sidebar token, oklch(0.985 0 0) */
            --makeway-border: #e5e5e5;        /* border token, oklch(0.922 0 0) */
            --makeway-text: #0a0a0a;          /* foreground token, oklch(0.145 0 0) */
            --makeway-muted: #737373;         /* muted-foreground, oklch(0.556 0 0) */
            --makeway-primary: #171717;       /* primary token, oklch(0.205 0 0) */
            --makeway-brand: #863bff;         /* the logo glyph purple */
            --makeway-radius: 10px;           /* --radius 0.625rem */
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--makeway-bg);
            color: var(--makeway-text);
            font-family:
                "Geist",
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                "Helvetica Neue",
                Arial,
                sans-serif;
        }

        /* ========================================
           MAKEWAY HEADER — the app shell's brand row
           ======================================== */

        .makeway-header {
            position: sticky;
            top: 0;
            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: space-between;

            height: 64px;
            padding: 0 32px;

            background: var(--makeway-header);
            color: var(--makeway-text);

            border-bottom: 1px solid var(--makeway-border);
        }

        .makeway-header .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .makeway-header .logo {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
        }

        .makeway-header .brand-text {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .makeway-header h1 {
            margin: 0;

            font-size: 19px;
            line-height: 1;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--makeway-text);
        }

        .makeway-header .tag {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: var(--makeway-muted);
        }

        .makeway-header .page-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--makeway-muted);
        }

        /* Hide default Swagger header */
        .swagger-ui .topbar {
            display: none;
        }

        /* ========================================
           SWAGGER CONTENT
           ======================================== */

        .swagger-ui .wrapper {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Info block */

        .swagger-ui .info {
            margin: 28px 0 8px;
        }

        .swagger-ui .info .title {
            font-family: inherit;
            font-weight: 700;
            color: var(--makeway-text);
        }

        .swagger-ui .info .title small {
            background: var(--makeway-brand);
            border-radius: 6px;
        }

        .swagger-ui .info p,
        .swagger-ui .info li {
            color: var(--makeway-muted);
            font-size: 14px;
        }

        .swagger-ui .info a {
            color: var(--makeway-brand);
        }

        /* Server / scheme bar */

        .swagger-ui .scheme-container {
            max-width: 1180px;
            margin: 16px auto;
            padding: 12px 24px;

            background: var(--makeway-surface);

            border: 1px solid var(--makeway-border);
            border-radius: var(--makeway-radius);

            box-shadow: none;
        }

        /* Tags */

        .swagger-ui .opblock-tag {
            font-weight: 600;
            color: var(--makeway-text);
            border-bottom: 1px solid var(--makeway-border);
        }

        /* Operation cards */

        .swagger-ui .opblock {
            margin-bottom: 10px;

            border: 1px solid var(--makeway-border);
            border-radius: var(--makeway-radius);

            box-shadow:
                0 1px 2px rgba(15, 23, 42, 0.05);
        }

        .swagger-ui .opblock .opblock-summary {
            border-radius: var(--makeway-radius);
        }

        /* Filter */

        .swagger-ui .filter-container input {
            padding: 8px 12px;

            border: 1px solid var(--makeway-border);
            border-radius: 6px;
        }

        /* Models */

        .swagger-ui section.models {
            border: 1px solid var(--makeway-border);
            border-radius: var(--makeway-radius);

            background: var(--makeway-surface);
        }

        .swagger-ui section.models h4 {
            font-family: inherit;
            font-weight: 600;
            color: var(--makeway-text);
        }
    </style>
</head>

<body>

    <!-- ========================================
         MAKEWAY BRAND HEADER
         ======================================== -->

    <header class="makeway-header">

        <div class="brand">
            <!-- Same mark as the frontend favicon (public/favicon.svg).
                 ?v busts any cached pre-rebrand copy. -->
            <img class="logo" src="/swagger/logo.svg?v=2" alt="Makeway">

            <div class="brand-text">
                <h1>Makeway</h1>

                <span class="tag">
                    INTERNAL DEVELOPER PLATFORM
                </span>
            </div>
        </div>

        <span class="page-label">API reference</span>

    </header>

    <!-- Swagger UI -->

    <div id="swagger-ui"></div>

    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>

    <script>
        SwaggerUIBundle({
            url: "/openapi.json",

            dom_id: "#swagger-ui",

            layout: "BaseLayout",

            presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIBundle.SwaggerUIStandalonePreset
            ],

            deepLinking: true,

            docExpansion: "list",

            filter: true,

            tryItOutEnabled: true,

            displayRequestDuration: true,

            persistAuthorization: true,

            showExtensions: true,

            showCommonExtensions: true,

            defaultModelsExpandDepth: 1,

            defaultModelExpandDepth: 1
        });
    </script>

</body>
</html>
