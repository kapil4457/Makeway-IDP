<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge AI API Docs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚒️</text></svg>">
    <style>
        :root {
            --forge-bg: #f8fafc;
            --forge-surface: #ffffff;
            --forge-header: #0f172a;
            --forge-accent: #f97316;
            --forge-border: #e2e8f0;
            --forge-text: #1e293b;
            --forge-muted: #64748b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--forge-bg);
            color: var(--forge-text);
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* Brand header (replaces the default Swagger topbar) */
        .forge-header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 32px;
            background: var(--forge-header);
            color: #ffffff;
        }
        .forge-header .logo {
            display: grid;
            place-items: center;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: var(--forge-accent);
            font-size: 16px;
        }
        .forge-header h1 {
            margin: 0;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }
        .forge-header .tag {
            margin-left: 8px;
            font-size: 12px;
            font-weight: 400;
            color: #94a3b8;
        }

        .swagger-ui .topbar { display: none; }

        /* Centered, readable content column */
        .swagger-ui .wrapper {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Info block */
        .swagger-ui .info { margin: 28px 0 8px; }
        .swagger-ui .info .title {
            font-family: inherit;
            font-weight: 700;
            color: var(--forge-text);
        }
        .swagger-ui .info .title small {
            background: var(--forge-accent);
            border-radius: 6px;
        }
        .swagger-ui .info p,
        .swagger-ui .info li { color: var(--forge-muted); font-size: 14px; }

        /* Server / scheme bar */
        .swagger-ui .scheme-container {
            max-width: 1180px;
            margin: 16px auto;
            padding: 12px 24px;
            background: var(--forge-surface);
            border: 1px solid var(--forge-border);
            border-radius: 8px;
            box-shadow: none;
        }

        /* Tag sections and operation cards */
        .swagger-ui .opblock-tag {
            font-weight: 600;
            color: var(--forge-text);
            border-bottom: 1px solid var(--forge-border);
        }
        .swagger-ui .opblock {
            margin-bottom: 10px;
            border: 1px solid var(--forge-border);
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
        }
        .swagger-ui .opblock .opblock-summary { border-radius: 8px; }

        /* Filter input */
        .swagger-ui .filter-container input {
            padding: 8px 12px;
            border: 1px solid var(--forge-border);
            border-radius: 6px;
        }

        /* Models section */
        .swagger-ui section.models {
            border: 1px solid var(--forge-border);
            border-radius: 8px;
            background: var(--forge-surface);
        }
        .swagger-ui section.models h4 {
            font-family: inherit;
            font-weight: 600;
            color: var(--forge-text);
        }
    </style>
</head>
<body>
    <header class="forge-header">
        <span class="logo">⚒️</span>
        <h1>Forge AI<span class="tag">API Documentation</span></h1>
    </header>

    <div id="swagger-ui"></div>

    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
        SwaggerUIBundle({
            // Schema is generated by FastAPI from the Pydantic models,
            // so the documentation can never drift from the code.
            url: '/openapi.json',
            dom_id: '#swagger-ui',
            layout: 'BaseLayout',
            presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIBundle.SwaggerUIStandalonePreset
            ],
            deepLinking: true,
            docExpansion: 'list',
            filter: true,
            tryItOutEnabled: true,
            displayRequestDuration: true,
            persistAuthorization: true,
            showExtensions: true,
            showCommonExtensions: true,
            defaultModelsExpandDepth: 1,
            defaultModelExpandDepth: 1
        });
    </script>
</body>
</html>
