# Platform UI — nginx inside ECS (private subnets) behind the ALB.
#
# Two jobs:
#   1. Serve the built Vite SPA (static files + SPA fallback for react-router
#      paths like /apps/orders).
#   2. Reverse-proxy the control-plane API paths to the control-plane tasks —
#      the same job the Vite dev proxy does locally, minus the /api rewrite.
#      The ALB fronts THIS container, not the API; the browser sees a single
#      origin, so no CORS and no mixed content.
#
# The control-plane tasks are resolved via ECS Cloud Map service discovery
# (control-plane.makeway.internal — the A records the ECS service registers).
# Variable proxy_pass + resolver force per-request DNS re-resolution: task ENI
# IPs churn on every deploy, and an IP resolved once at startup would 502
# until nginx is reloaded.

resolver 169.254.169.253 ipv6=off valid=3s;  # AWS VPC resolver, AZ-independent

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # App-create payloads carry the full service/capability config JSON.
    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml;

    # In-cluster API target, resolved per request (see resolver above).
    set $cp control-plane.makeway.internal:8000;

    # API + docs passthrough. The regex boundary is exact-or-slash on purpose:
    # the API prefix /app must not swallow the UI route /apps (nor /cluster
    # swallow /clusters). /internal stays private — the UI never calls it and
    # it is the worker-callback surface.
    location ~ ^/(app|auth|cluster|docs|openapi\.json|swagger)(/|$) {
        proxy_pass http://$cp;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Hashed build assets — content-addressed, cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The SPA shell + everything react-router owns. Unknown paths fall back to
    # index.html; the fallback is an internal redirect, so location matching
    # re-runs and lands in the exact-match block below (cache headers included).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Served on every SPA route — always revalidate so deploys land on refresh.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # public/ icons — revalidate so rebrands propagate (same policy as the
    # control plane's /docs + /swagger/logo.svg).
    location = /favicon.svg {
        add_header Cache-Control "no-cache";
    }
    location = /icons.svg {
        add_header Cache-Control "no-cache";
    }
}